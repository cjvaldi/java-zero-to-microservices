<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body>

	<header th:replace="~{layout/layout :: header}"></header>

	<div class="container py-4">

		<div class="card col-md-6 mx-auto">
        <div class="card-header">Por favor inicie sesión</div>
        <div class="card-body">
            
            <!-- Mensaje de Error -->
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            
            <!-- Mensaje de Logout -->
            <div th:if="${success != null}" class="alert alert-success" th:text="${success}"></div>

            <!-- Formulario procesado automáticamente por Spring Security en /login -->
            <form th:action="@{/login}" method="post">
                
                <div class="form-group mb-3">
                    <label for="username">Usuario:</label>
                    <input type="text" name="username" id="username" class="form-control" autofocus required>
                </div>

                <div class="form-group mb-3">
                    <label for="password">Contraseña:</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" >Iniciar Sesión</button>
                </div>
                
            </form>
        </div>
	</div>
	</div>

	<footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
