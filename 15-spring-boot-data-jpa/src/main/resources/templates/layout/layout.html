<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
<meta charset="UTF-8" />
<title
	th:text="'Spring Boot: MVC + Thymeleaf + Data JPA - ' + ${titulo}"></title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/jquery-ui.min.css}">
</head>
<body>
	<header th:fragment="header">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="#">Spring Boot</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarNav"
					aria-controls="navbarNav" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav">
						<li class="nav-item"><a class="nav-link active"
							aria-current="page" href="#">Home</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/listar}">Clientes</a>
						</li>
					</ul>
					<ul class="navbar-nav ms-auto">
						<!-- Si NO está autenticado -->
						<li class="nav-item" sec:authorize="!isAuthenticated()"><a
							class="btn btn-outline-primary" th:href="@{/login}">Sign In</a></li>

						<!-- Si ESTÁ autenticado -->
						<li class="nav-item dropdown" sec:authorize="isAuthenticated()">
							<a
							class="nav-link dropdown-toggle btn btn-outline-success text-white mx-2"
							href="#" id="userDropdown" role="button" data-toggle="dropdown"
							aria-haspopup="true" aria-expanded="false"> <span
								sec:authentication="name"></span>
						</a>

							<div class="dropdown-menu dropdown-menu-right"
								aria-labelledby="userDropdown">
								<form th:action="@{/logout}" method="post">
									<button class="dropdown-item text-danger" type="submit">Sign
										Out</button>
								</form>
							</div>
						</li>
					</ul>
				</div>
			</div>
		</nav>
		<div class="alert alert-success" th:if="${success != null}"
			th:text="${success}"></div>
		<div class="alert alert-danger" th:if="${error != null}"
			th:text="${error}"></div>
		<div class="alert alert-warning" th:if="${warning != null}"
			th:text="${warning}"></div>
		<div class="alert alert-info" th:if="${info != null}"
			th:text="${info}"></div>
	</header>
	<div class="container"></div>

	<footer th:fragment="footer" class="container">
		<hr />
		<img th:src="@{/images/logo.jpg}" alt="Spring logo" />
		<p sec:authorize="isAuthenticated()">
			Usuario Logueado : <span sec:authentication="name"></span> | Roles :
			<span sec:authentication="principal.authorities"></span>
		</p>
		<p>
			Power by <a href="https://spring.io/projects/spring-boot">Spring
				Boot</a> y <a href="https://www.thymeleaf.org/">Thymeleaf</a>
		</p>
		<p>
			Este proyecto fue desarrollado en IDE Eclipse + Spring Plugins (STS
			Spring Tool),Alumno Cristian Valdivieso. <br />&copy; Company 2026,
			Inc.Todos los derechos reservados.Términos de uso y privacidad.<br />
		</p>
		<!-- 		Optional JavaScrip -->
		<!--  JQuery , bootstrap JS -->
		<script th:src="@{/js/jquery.min.js}"></script>
		<!-- 		<script th:src="@{/js/popper.min.js}"></script> -->
		<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
		<script th:src="@{/js/jquery-ui.min.js}"></script>
	</footer>


</body>
</html>
